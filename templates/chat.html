<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Research AI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f2f2f7;
      --header-bg: rgba(255,255,255,0.85);
      --user-bubble: #007aff;
      --agent-bubble: #ffffff;
      --agent-text: #1c1c1e;
      --input-bg: #ffffff;
      --border: #d1d1d6;
      --placeholder: #8e8e93;
      --send-btn: #007aff;
      --reset-color: #ff3b30;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --header-bg: rgba(28,28,30,0.9);
        --agent-bubble: #1c1c1e;
        --agent-text: #f2f2f7;
        --input-bg: #1c1c1e;
        --border: #38383a;
        --placeholder: #636366;
      }
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: var(--font);
      -webkit-text-size-adjust: 100%;
    }

    /* ── Layout ── */
    .layout {
      display: flex;
      flex-direction: column;
      height: 100dvh; /* dynamic viewport height — accounts for Safari toolbar */
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: env(safe-area-inset-top, 0) 16px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: calc(56px + env(safe-area-inset-top, 0px));
    }

    .header-title {
      display: flex;
      flex-direction: column;
    }

    .header-title h1 {
      font-size: 17px;
      font-weight: 600;
      color: var(--agent-text);
      line-height: 1.2;
    }

    .header-title p {
      font-size: 12px;
      color: var(--placeholder);
    }

    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #007aff, #5ac8fa);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .btn-reset {
      background: none;
      border: none;
      color: var(--reset-color);
      font-size: 14px;
      font-family: var(--font);
      cursor: pointer;
      padding: 8px 4px;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Messages area ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 78%;
    }

    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.agent { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user .bubble {
      background: var(--user-bubble);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.agent .bubble {
      background: var(--agent-bubble);
      color: var(--agent-text);
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }

    /* ── Typing indicator ── */
    .typing-dots {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
    }

    .typing-dots span {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--placeholder);
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* ── Error message ── */
    .msg.error .bubble {
      background: #fff0f0;
      color: #c0392b;
      border: 1px solid #f5c6cb;
    }

    @media (prefers-color-scheme: dark) {
      .msg.error .bubble { background: #2c1a1a; color: #ff6b6b; border-color: #5c2c2c; }
    }

    /* ── Input bar ── */
    .input-bar {
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      padding-bottom: max(10px, env(safe-area-inset-bottom, 10px));
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .input-wrap {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      display: flex;
      align-items: flex-end;
      padding: 8px 14px;
      min-height: 40px;
    }

    textarea {
      flex: 1;
      border: none;
      background: transparent;
      font-family: var(--font);
      font-size: 15px;
      color: var(--agent-text);
      resize: none;
      outline: none;
      line-height: 1.4;
      max-height: 120px;
      overflow-y: auto;
      -webkit-appearance: none;
    }

    textarea::placeholder { color: var(--placeholder); }

    .btn-send {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--send-btn);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }

    .btn-send:disabled { opacity: 0.4; cursor: default; }

    .btn-send svg { fill: #fff; width: 16px; height: 16px; }

    /* ── Welcome screen ── */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 32px;
      color: var(--placeholder);
    }

    .welcome .icon { font-size: 48px; }
    .welcome h2 { font-size: 20px; font-weight: 600; color: var(--agent-text); }
    .welcome p { font-size: 14px; line-height: 1.5; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }

    .chip {
      background: var(--agent-bubble);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
      color: var(--send-btn);
      font-family: var(--font);
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    .chip:active { opacity: 0.7; }
  </style>
</head>
<body>
<div class="layout">

  <header>
    <div class="avatar">🔬</div>
    <div class="header-title" style="flex:1; margin-left:10px;">
      <h1>Research AI</h1>
      <p>Your research consultant assistant</p>
    </div>
    <button class="btn-reset" id="btnReset" title="New conversation">Clear</button>
  </header>

  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="icon">🔬</div>
      <h2>Research Assistant</h2>
      <p>Ask me to manage projects, save notes, or explore research topics.</p>
      <div class="chips">
        <button class="chip" onclick="sendChip(this)">Create a new project</button>
        <button class="chip" onclick="sendChip(this)">Show all my projects</button>
        <button class="chip" onclick="sendChip(this)">Save a research note</button>
        <button class="chip" onclick="sendChip(this)">List my notes</button>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <div class="input-wrap">
      <textarea
        id="input"
        rows="1"
        placeholder="Message…"
        autocomplete="off"
        autocorrect="on"
        spellcheck="true"
      ></textarea>
    </div>
    <button class="btn-send" id="btnSend" disabled>
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('input');
  const sendBtn    = document.getElementById('btnSend');
  const resetBtn   = document.getElementById('btnReset');
  const welcomeEl  = document.getElementById('welcome');

  let busy = false;

  // ── auto-grow textarea ──
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    sendBtn.disabled = !inputEl.value.trim();
  });

  // ── send on Enter (Shift+Enter = newline) ──
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled && !busy) sendMessage();
    }
  });

  sendBtn.addEventListener('click', () => { if (!busy) sendMessage(); });

  resetBtn.addEventListener('click', async () => {
    await fetch('/reset', { method: 'POST' });
    messagesEl.innerHTML = '';
    messagesEl.appendChild(welcomeEl);
    welcomeEl.style.display = '';
  });

  function sendChip(btn) {
    inputEl.value = btn.textContent;
    sendBtn.disabled = false;
    sendMessage();
  }

  function addMsg(role, text) {
    hideWelcome();
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    scrollBottom();
    return bubble;
  }

  function addTyping() {
    hideWelcome();
    const wrap = document.createElement('div');
    wrap.className = 'msg agent';
    wrap.id = 'typing';
    wrap.innerHTML = '<div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>';
    messagesEl.appendChild(wrap);
    scrollBottom();
  }

  function removeTyping() {
    document.getElementById('typing')?.remove();
  }

  function hideWelcome() {
    if (welcomeEl.style.display !== 'none') welcomeEl.style.display = 'none';
  }

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || busy) return;

    busy = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    addMsg('user', text);
    addTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      removeTyping();

      if (data.error) {
        addMsg('error', '⚠ ' + data.error);
      } else {
        addMsg('agent', data.reply);
      }
    } catch (err) {
      removeTyping();
      addMsg('error', '⚠ Network error. Please try again.');
    }

    busy = false;
    sendBtn.disabled = !inputEl.value.trim();
    inputEl.focus();
  }
</script>
</body>
</html>
